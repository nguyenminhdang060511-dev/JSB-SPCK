<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ — CHẠM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-success fs-4" href="index.html">🌿 CHẠM</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto fw-semibold">
          <li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link active text-success" href="contact.html">Liên Hệ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5" style="max-width: 800px;">

    <div class="text-center mb-4">
      <h1 class="fw-bold">LIÊN HỆ VỚI CHẠM</h1>
      <p class="text-muted">Bạn có một câu chuyện muốn chia sẻ cùng dự án?</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
      <div class="row g-0">
        <div class="col-md-5 d-none d-md-block">
          <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=800&auto=format&fit=crop"
            class="img-fluid h-100 object-fit-cover" alt="Liên hệ CHẠM">
        </div>
        <div class="col-md-7 p-4 p-md-5">
          <form action="submit.html" method="post" >
            <div class="mb-3">
              <label class="form-label fw-semibold small">Họ và tên</label>
              <input type="text" class="form-control rounded-3" placeholder="Nhập họ tên của bạn">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Email liên hệ</label>
              <input type="email" class="form-control rounded-3" placeholder="example@email.com">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Chủ đề</label>
              <input type="text" class="form-control rounded-3" placeholder="Chia sẻ câu chuyện / Đóng góp">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Nội dung tin nhắn</label>
              <textarea class="form-control rounded-3" rows="4" placeholder="Viết nội dung tại đây..."></textarea>
            </div>
            <button type="button" class="btn btn-success rounded-pill px-4 w-100 fw-bold"
              onclick="alert('Cảm ơn bạn đã gửi tin nhắn liên hệ!')">GỬI TIN NHẮN</button>
          </form>
        </div>
      </div>
    </div>

  </div>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2026 CHẠM — Chạm vào câu chuyện – Chạm đến sự thay đổi.</p>
  </footer>

</body>

</html>
