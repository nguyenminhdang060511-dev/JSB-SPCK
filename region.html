  <!-- LOGIC RENDER HIỂN THỊ CÂU CHUYỆN -->
  <script>
    // Hàm dựng HTML cho từng card câu chuyện
    function renderStoryCard(story, vungKey) {
      return `
        <div class="col-md-6 col-lg-4">
          <div class="story-card bg-white rounded-3 shadow-sm overflow-hidden h-100" 
               style="cursor: pointer; transition: transform 0.2s;"
               onclick="location.href='story-detail.html?vung=${vungKey}&id=${story.id}'">
            <img src="${story.image}" class="w-100" style="height: 220px; object-fit: cover;" alt="${story.title}">
            <div class="p-4">
              <span class="badge bg-success mb-2">${story.location}</span>
              <h3 class="fw-bold h5 mb-2 text-dark">${story.title}</h3>
              <p class="text-muted small mb-3 text-truncate-2">${story.shortDesc}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-success fw-bold small">Đọc chi tiết <i class="fa-solid fa-arrow-right ms-1"></i></span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Hàm load dữ liệu dựa trên tham số URL (?vung=...)
    function loadPageContent() {
      const urlParams = new URLSearchParams(window.location.search);
      const regionKey = urlParams.get('vung');

      const container = document.getElementById('stories-container');
      const titleEl = document.getElementById('region-title');
      const subtitleEl = document.getElementById('region-subtitle');

      if (!container) return;

      let htmlContent = '';

      // Trường hợp 1: Chọn một vùng cụ thể (từ Bản đồ hoặc Dropdown)
      if (regionKey && storiesData[regionKey]) {
        const regionData = storiesData[regionKey];
        if (titleEl) titleEl.innerText = regionData.title;
        if (subtitleEl) subtitleEl.innerText = `Lắng nghe các câu chuyện truyền cảm hứng tại ${regionData.title}`;

        if (regionData.stories && regionData.stories.length > 0) {
          regionData.stories.forEach(story => {
            htmlContent += renderStoryCard(story, regionKey);
          });
        } else {
          htmlContent = `<div class="col-12 text-center text-muted py-5"><p>Chưa có câu chuyện nào cho vùng này.</p></div>`;
        }
      } 
      // Trường hợp 2: Xem "Tất cả vùng miền"
      else {
        if (titleEl) titleEl.innerText = "TẤT CẢ CÂU CHUYỆN";
        if (subtitleEl) subtitleEl.innerText = "Những câu chuyện mộc mạc và chân thật trên khắp mọi miền đất nước";

        Object.keys(storiesData).forEach(vung => {
          if (storiesData[vung].stories) {
            storiesData[vung].stories.forEach(story => {
              htmlContent += renderStoryCard(story, vung);
            });
          }
        });
      }

      container.innerHTML = htmlContent;
    }

    // Tự động kích hoạt khi trang tải xong hoặc khi bấm Back/Forward trên trình duyệt
    document.addEventListener('DOMContentLoaded', loadPageContent);
    window.addEventListener('pageshow', loadPageContent);
  </script>
